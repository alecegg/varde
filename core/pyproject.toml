[project]
name = "varde-core"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "PyYAML>=6,<7", # YAML 1.2-compatible frontmatter parsing.
]

[project.entry-points."varde.skills"]
core = "varde_core"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "varde_core"
