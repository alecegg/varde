[package]
name = "varde-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/alecegg/varde"
description = "Shared pure helpers for the Varde CLIs"

[dependencies]
dirs = "7.0.0"
indexmap = { version = "2.14.2", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[features]
# The feature is also used on Linux, where the counter needs no extra crate.
write-meter = ["dep:libc"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
