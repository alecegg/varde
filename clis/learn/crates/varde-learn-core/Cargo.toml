[package]
name = "varde-learn-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared types for the varde-learn CLI"

[lib]
name = "varde_learn_core"

[dependencies]
libc = "0.2.189"
fs2 = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "=0.3.47", default-features = false, features = ["parsing", "formatting"] }
toml = "1.1.6"
