[package]
name = "varde-learn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for measuring varde skill trigger accuracy and skill-guided output quality"

[[bin]]
name = "varde-learn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
varde-learn-core = { path = "../varde-learn-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
