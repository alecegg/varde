[package]
autotests = false
name = "varde-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for checking agent-facing Markdown documents"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.19.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sha2 = "0.10.9"
sha1 = "0.10"
varde-contracts.workspace = true
varde-core.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "doc_suite"
path = "tests/doc_suite/main.rs"
