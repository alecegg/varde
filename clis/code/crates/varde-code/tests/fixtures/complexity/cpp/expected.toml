[["n/a"]]
matrix_id = "try-finally-zero"
reason = "C++ has no `finally` clause; `try` is always paired with one or more `catch` clauses, whose single-point behavior is pinned by catch-once."

[["n/a"]]
matrix_id = "null-coalescing-zero"
reason = "C++ has no null-coalescing operator; pointer and optional checks are written as explicit conditions."

[["n/a"]]
matrix_id = "named-nested-function"
reason = "C++ has no nested named function definitions; local classes (class-in-method) and lambdas (lambda-nesting) cover nested callables."

[["n/a"]]
matrix_id = "compensating-usage"
reason = "The compensating-usage markers apply to JS/TS/TSX declaration-only functions and Python decorators; C++ has neither form."

[["n/a"]]
matrix_id = "compensating-usage-callback"
