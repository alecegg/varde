reason = "Ruby grammar has no goto statement or label target syntax; bare labels are hash-key syntax, not jump targets (spec:238-243)."

[["n/a"]]
matrix_id = "multi-level-break"
reason = "Ruby break and next have no label or numeric nesting-depth argument; break's optional value is an expression, not a level (spec:238-243)."

