# Built-in empty-handler syntax policies.
#
# A comment inside a handler body is intentional suppression. Comments remain
# AST children, so comment-only bodies do not match these patterns.
[[rule]]
id = "empty-catch-block"
kind = "pattern"
severity = "error"
name = "Empty catch handler policy"
description = "A bound catch handler with an empty body violates the empty-handler syntax policy."
message = "empty catch handler violates the empty-handler syntax policy"
remediation = "handle or log the error, or add a comment inside the handler explaining intentional suppression"
pattern = "try { $$$A } catch ($ERR) { }"
languages = ["typescript", "tsx", "javascript"]

[[rule]]
id = "empty-catch-block-unbound"
kind = "pattern"
severity = "error"
name = "Empty unbound catch handler policy"
description = "An unbound catch handler with an empty body violates the empty-handler syntax policy."
message = "empty unbound catch handler violates the empty-handler syntax policy"
remediation = "handle or log the error, or add a comment inside the handler explaining intentional suppression"
pattern = "try { $$$A } catch { }"
languages = ["typescript", "tsx", "javascript"]

# `constraints.ERR = "!^(ImportError|ModuleNotFoundError)$"` excludes two
# idiomatic Python optional-dependency suppression shapes.
[[rule]]
id = "empty-except-block"
kind = "pattern"
severity = "error"
name = "Empty except handler policy"
description = "A Python except handler whose body is only `pass` violates the empty-handler syntax policy."
message = "empty except handler violates the empty-handler syntax policy"
remediation = "handle or log the exception, or add a comment inside the handler explaining intentional suppression"
pattern = "try:\n    $$$A\nexcept $ERR: pass"
languages = ["python"]
constraints = { ERR = "!^(ImportError|ModuleNotFoundError)$" }

[[rule]]
id = "empty-except-block-bare"
kind = "pattern"
severity = "error"
name = "Empty bare except handler policy"
description = "A Python bare except handler whose body is only `pass` violates the empty-handler syntax policy."
message = "empty bare except handler violates the empty-handler syntax policy"
remediation = "handle or log the exception, or add a comment inside the handler explaining intentional suppression"
pattern = "try:\n    $$$A\nexcept: pass"
languages = ["python"]

