[[rule]]
id = "circular-import"
kind = "sql"
verification = "dependency-facts"
severity = "error"
name = "Direct dependency cycle policy"
description = "Two certified dependency units import each other directly. Go units are package directories; other units are files."
message = "direct dependency cycle between {from_unit} and {to_unit}"
remediation = "break the direct dependency cycle or document an intentional exception"
query = """
WITH pairs AS (
 SELECT a.*, ROW_NUMBER() OVER (PARTITION BY a.from_unit, a.to_unit ORDER BY f.path, e.start_byte, e.id) AS position
 FROM dependency_facts a JOIN files f ON f.id = a.from_file_id
 JOIN entities e ON e.id = a.source_entity_id
 WHERE a.certainty = 'certified' AND a.from_unit < a.to_unit
 AND EXISTS (SELECT 1 FROM dependency_facts b WHERE b.certainty = 'certified' AND b.from_unit = a.to_unit AND b.to_unit = a.from_unit)
)
SELECT f.path AS file, e.start_line AS line, e.start_byte, e.end_byte, e.start_col, e.end_line, e.end_col, a.from_unit, a.to_unit, a.certainty
FROM pairs a JOIN files f ON f.id = a.from_file_id JOIN entities e ON e.id = a.source_entity_id
WHERE a.position = 1 ORDER BY a.from_unit, a.to_unit
"""
