[[rule]]
id = "dependency-boundary"
kind = "sql"
verification = "dependency-boundary"
severity = "error"
name = "Declared dependency boundary"
description = "Forbids certified imports between explicitly configured source and target directories. Empty prefixes leave this policy inactive."
message = "dependency from {from_unit} to {to_unit} violates the declared directory boundary"
remediation = "remove or invert the dependency, or revise the declared boundary policy"
query = """
SELECT f.path AS file, e.start_line AS line, e.start_byte, e.end_byte, e.start_col, e.end_line, e.end_col, d.from_unit, d.to_unit, d.specifier, d.certainty,
 :source_prefix AS source_prefix, :target_prefix AS target_prefix
FROM dependency_facts d JOIN files f ON f.id = d.from_file_id JOIN entities e ON e.id = d.source_entity_id
WHERE d.certainty = 'certified'
AND (:source_prefix = '.' OR d.from_unit = :source_prefix OR instr(d.from_unit, :source_prefix || '/') = 1)
AND (:target_prefix = '.' OR d.to_unit = :target_prefix OR instr(d.to_unit, :target_prefix || '/') = 1)
ORDER BY f.path, e.start_byte, d.to_unit
"""
strings = { source_prefix = "", target_prefix = "" }
