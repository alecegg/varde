# Hardcoded-credential rules for ruby, php, lua, bash.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.
#
# Language forms:
# - ruby: local, global, constant and instance/class-variable assignment
#   (`k = "..."`, `K = "..."`, `@k = "..."`, `@@k = "..."`); the shared KEY regex
#   accepts the leading `@`/`@@`.
# - php: variable assignment (`$k = "..."`), global or class constant
#   (`const K = "..."`) and `define('K', "...")` / `define("K", "...")`.
# - lua: local and plain assignment (`local k = "..."`, `k = "..."`); the
#   assignment pattern also matches inside the `local` declaration.
# - bash: variable assignment (`K="..."`), including the `export`, `readonly`,
#   `declare` and `local` declaration forms, which wrap the same
#   `variable_assignment` node.
#
# `exclude_test_paths` drops findings in spec/test files, matching the rust pack.
#
# Raw and multiline literals are accepted by the shared VAL (see
# hardcoded_credential_literal.toml for the VAL shape). Not matched, with reasons:
# Ruby heredocs (the `$VAL` capture is only the `<<~EOT` beginning, so no content
# evidence is available) and Lua table fields (ast-grep cannot parse a bare
# `field` pattern). Unquoted Bash values stay out of scope.
#
# All rules share the same KEY and VAL constraints as hardcoded-credential-literal
# (enforced by credential_rules_share_key_and_val_constraints).
[[rule]]
id = "hardcoded-credential-ruby"
kind = "pattern"
severity = "error"
name = "Hardcoded credential assignment"
description = "A string literal is assigned to a credential-named variable or constant."
message = "hardcoded credential assignment: a secret-like string is bound to a credential-named variable"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$KEY = $VAL"
languages = ["ruby"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

