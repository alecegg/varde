# Hardcoded-credential rules for c, cpp, swift, dart.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.
#
# One declaration/assignment form per rule: the matcher locates a pattern by
# node kind, so a C pointer declaration, a C array declarator and a plain
# assignment cannot share a single pattern. Each rule binds $KEY to exactly the
# binding identifier, so the shared KEY regex applies unchanged. A leading
# `$$$MOD` makes a declaration pattern ignore its modifiers, so one Swift rule
# covers `let`/`var` with any `static`/`private`/`public`/`open` stack and one
# C/C++ rule covers the declaration with or without a storage class (`static`,
# `extern`); the typed, untyped, sized-array and C++ `auto` forms keep their own
# rules. Dart class-level and top-level declarations live in
# hardcoded_credential_native_apple_class.toml. Measured reach limits: C++ types
# and in-class member initializers beyond the listed forms are not matched.
# Raw and multiline string literals (Swift `"""`/`#"..."#`, Dart `r'...'`, C++
# `R"(...)"`) are matched by the widened shared VAL; the fixture contracts pin
# that behavior. Every rule sets `exclude_test_paths`, so test, spec and
# fixture paths do not report.

[[rule]]
id = "hardcoded-credential-c"
kind = "pattern"
severity = "error"
name = "Hardcoded C credential assignment"
description = "A C assignment binds a string literal to a credential-named variable."
message = "hardcoded credential assignment: a secret-like string is assigned to a credential-named C variable"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$KEY = $VAL"
languages = ["c"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

