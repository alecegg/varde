# Hardcoded-credential rules for java, kotlin, scala, csharp.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.
#
# One declaration form per rule: the matcher locates a pattern by node kind, so
# `val`/`var` declarations (Kotlin, Scala), typed and untyped, cannot share a
# single pattern. A leading `$$$MOD` ignores declaration modifiers, so one
# Kotlin or Scala rule covers `val` with `private`, `const`, `override`,
# `lazy` and annotation modifiers, and the Java field rule covers any
# `private static final` stack. Java fields are declarations of the class body
# and need their own rule: `hardcoded-credential-java` matches `String k = ...`
# locals, `hardcoded-credential-java-field` matches fields. `$TYPE` absorbs C#
# modifiers, so one C# rule covers local, field, `const` and `readonly`
# declarations; auto-property initializers (`{ get; set; } = "..."`) are
# separate property declarations with one rule per accessor list. Every rule
# sets `exclude_test_paths`, so test, spec and fixture paths do not report.

[[rule]]
id = "hardcoded-credential-java"
kind = "pattern"
severity = "error"
name = "Hardcoded Java credential declaration"
description = "A Java local variable declaration binds a string literal to a credential-named variable."
message = "hardcoded credential declaration: a secret-like string is declared as a credential-named Java variable"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$TYPE $KEY = $VAL"
languages = ["java"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

