[package]
name = "varde-toz"
version.workspace = true
edition = "2021"
license.workspace = true
repository = "https://github.com/alecegg/varde"
description = "Keep large tool output out of an LLM agent's context window"
keywords = ["llm", "agent", "claude-code", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = "3.27.0"
toz-core = { package = "varde-toz-core", path = "../toz-core", version = "2.0.1" }
varde-contracts.workspace = true
varde-core.workspace = true
walkdir = "2.5.0"

[dev-dependencies]
insta = "1.48.0"
