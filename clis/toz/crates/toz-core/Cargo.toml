[package]
autotests = false
name = "varde-toz-core"
version.workspace = true
edition = "2021"
license.workspace = true
repository = "https://github.com/alecegg/varde"
description = "Keep large tool output out of an LLM agent's context window"
keywords = ["llm", "agent", "claude-code", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "toz_core"

[dependencies]
anyhow.workspace = true
blake3 = "1.8.7"
dom_smoothie = "0.18.2"
getrandom = "0.4.3"
htmd = "0.5.5"
memmap2 = "0.9.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "deflate", "charset", "http2", "system-proxy"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "classes", "properties"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
thiserror = "2.0.20"
tempfile = "3.27.0"
toml = "1.1.6"
varde-core.workspace = true

[dev-dependencies]
insta = "1.48.0"
varde-core = { workspace = true, features = ["write-meter"] }

[[test]]
name = "fixtures"
path = "tests/fixtures_suite/main.rs"

[[test]]
name = "env_fallback"
path = "tests/env_fallback.rs"

[[test]]
name = "prune_maintenance"
path = "tests/prune_maintenance.rs"

[[test]]
name = "write_budget"
path = "tests/write_budget.rs"
