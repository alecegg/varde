[package]
autotests = false
name = "varde-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for Concept/Knowledge Bundle CRUD with OCC writes."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs4 = { version = "1.1.0", features = ["sync"] }
varde-workflow-core = { path = "../md-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10.9"
varde-contracts.workspace = true
varde-core.workspace = true

[[test]]
name = "workflow_suite"
path = "tests/workflow_suite/main.rs"
