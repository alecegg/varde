[[rule]]
id = "unresolved-local-import"
kind = "sql"
verification = "dependency-facts"
severity = "error"
name = "Missing explicit source import"
description = "An explicit relative source filename and supported source aliases are absent from the filesystem."
message = "relative source import {specifier} has no existing supported target"
remediation = "correct the source path or restore the missing file"
query = """
SELECT f.path AS file, e.start_line AS line, e.start_byte, e.end_byte, e.start_col, e.end_line, e.end_col, d.specifier, d.certainty
FROM dependency_facts d JOIN files f ON f.id = d.from_file_id JOIN entities e ON e.id = d.source_entity_id
WHERE d.certainty = 'missing' ORDER BY f.path, e.start_byte
"""
