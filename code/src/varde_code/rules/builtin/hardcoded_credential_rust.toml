# Hardcoded-credential rules for rust.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.
#
# One rule per Rust node kind: `let_declaration` (untyped and type-annotated
# forms are structurally distinct, so they take separate rules), `const_item`
# and `static_item`. Every rule carries the same KEY and VAL constraints as
# `hardcoded-credential-literal`; the credential drift test enforces it.
#
# `exclude_test_paths` drops findings in test-path files, where this repository
# keeps its synthetic tokens (`tests/`, `*/tests.rs`). Inline `#[cfg(test)]`
# modules are not path-detectable; the one such fixture here carries an inline
# `varde-ignore-next-line hardcoded-credential-rust`.
#
# A leading `$$$MOD` ignores declaration modifiers, so `pub const`, `pub static`,
# `static mut` and `let mut` bindings match their rule.
#
# Not matched: escaped-newline content (the backslash is outside the shared VAL
# content class). Raw strings (`r"..."`, `r#"..."#`, `b"..."`) and multiline
# literals are matched by the widened shared VAL, which accepts their delimiters
# (see hardcoded_credential_literal.toml for the VAL shape).

[[rule]]
id = "hardcoded-credential-rust"
kind = "pattern"
severity = "error"
name = "Hardcoded credential let initializer"
description = "An untyped `let` binding initializes a credential-named variable with a secret-like string literal."
message = "hardcoded credential let initializer: a secret-like string is bound to a credential-named variable"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$$$MOD let $KEY = $VAL;"
languages = ["rust"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

