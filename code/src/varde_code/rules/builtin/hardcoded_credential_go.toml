# Hardcoded-credential rules for go.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.

# Go binds string literals to credential-named identifiers in four syntactic
# forms, each its own tree-sitter node kind: `:=` (short_var_declaration),
# `=` (assignment_statement), `var` (var_declaration) and `const`
# (const_declaration). One pattern per rule matches one form; all four share
# the same KEY and VAL constraints as hardcoded-credential-literal (the drift
# test enforces this). The `var` rule's `$$$T` slot matches zero or one type
# node, so typed (`var x string = "..."`) and untyped declarations share one
# rule. Multi-name bindings (`a, b := ...`), whose left side is an identifier
# list, are a documented limit: the KEY capture binds the whole list and fails
# the anchored regex. Raw backtick string literals are matched by the widened
# shared VAL. Every rule sets `exclude_test_paths`, so test, spec and fixture
# paths do not report.
[[rule]]
id = "hardcoded-credential-go"
kind = "pattern"
severity = "error"
name = "Hardcoded credential assignment"
description = "A string literal is assigned to a credential-named variable."
message = "hardcoded credential assignment: a secret-like string is assigned to a credential-named variable"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$KEY = $VAL"
languages = ["go"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

