# Ban bare eval call syntax, including shadowed identifiers.
# This policy does not establish callee identity or exploitability.
[[rule]]
id = "eval-usage"
kind = "pattern"
severity = "error"
name = "eval() usage"
description = "A bare eval call violates the dynamic-evaluation syntax policy. Member calls are excluded."
message = "bare eval() call violates the dynamic-evaluation syntax policy"
remediation = "use an explicit parser or dispatch table, or document a reviewed intentional call"
pattern = "eval($$$ARGS)"
languages = ["javascript", "typescript", "tsx", "python"]

# Additional language-specific dynamic evaluation syntax policies.
[[rule]]
id = "eval-usage-ruby"
kind = "pattern"
severity = "warning"
name = "eval() usage"
description = "A bare eval call uses Ruby's dynamic-evaluation syntax."
message = "bare eval() call uses dynamic-evaluation syntax"
remediation = "use an explicit parser or dispatch table, or document a reviewed intentional call"
pattern = "eval($$$ARGS)"
languages = ["ruby"]

