# Hardcoded-credential rules for Dart class-level and top-level declarations.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.
#
# The base Dart rules in hardcoded_credential_native_apple.toml reach only
# function-local declarations. Dart gives each declaration form its own node
# kind, so class members and top-level declarations need separate rules:
# - member (`class_member > declaration`), wrapped in a class body by the
#   `$$$MOD` marker: untyped `final`/`var`, untyped `const` (and
#   `static final`/`static const`), typed, and typed `const`/`static const`.
#   `$$$MOD` ignores `static`, `late` and the other modifiers.
# - top level (`top_level_variable_declaration`), written with a trailing `;`
#   so it parses as written: `final`/`const`, `var`, typed, and typed
#   `final`/`const`.
# Every rule shares the KEY and VAL constraints of hardcoded-credential-literal
# and sets `exclude_test_paths`, so test, spec and fixture paths do not report.

[[rule]]
id = "hardcoded-credential-dart-member"
kind = "pattern"
severity = "error"
name = "Hardcoded Dart member credential declaration"
description = "A Dart class member declared `final` or `var` without a type binds a string literal to a credential-named field."
message = "hardcoded credential declaration: a secret-like string is declared as a credential-named Dart class member"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$$$MOD final $KEY = $VAL"
languages = ["dart"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

