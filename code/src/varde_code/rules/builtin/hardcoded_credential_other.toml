# Hardcoded-credential rules for elixir, haskell, solidity.
# Severity evidence: error needs zero false positives across this repository and
# at least three reference repositories per language; tighten on a false positive.
#
# Language forms:
# - elixir: variable binding (`k = "..."`) and module attribute
#   (`@k "..."`), which is not a binding and needs its own pattern.
# - haskell: bare binding (`k = "..."`) and annotated binding
#   (`k = "..." :: String`). tree-sitter-haskell wraps the annotated form in one
#   `signature` node, so it needs its own pattern.
# - solidity: file-level constant (`string constant k = "..."`), local typed
#   declaration (`string k = "..."`), assignment (`k = "..."`) and contract
#   state variable (`string public k = "..."`). A state variable parses as
#   `state_variable_declaration` only inside a contract body, so its `$$$MOD`
#   pattern is wrapped in one and ignores `public`, `constant` and `immutable`.
# All rules share the same KEY and VAL constraints as hardcoded-credential-literal
# (enforced by credential_rules_share_key_and_val_constraints). Every rule sets
# `exclude_test_paths`, so test, spec and fixture paths do not report.

[[rule]]
id = "hardcoded-credential-elixir"
kind = "pattern"
severity = "error"
name = "Hardcoded credential binding"
description = "A string literal is bound to a credential-named variable."
message = "hardcoded credential binding: a secret-like string is bound to a credential-named variable"
remediation = "load real credentials from configuration or a secret store; document intentional fixture values"
pattern = "$KEY = $VAL"
languages = ["elixir"]
exclude_test_paths = true
[rule.constraints]
KEY = "^@{0,2}(?i)(api[_-]?key|access[_-]?key|client[_-]?secret|secret|password|passwd|credential|(access|auth|refresh|id|session)[_-]?token|token)$"
VAL = [
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]{16,}\\s*[A-Za-z_][A-Za-z0-9_]*)$",
  "^(?:[A-Za-z@]{0,7}#{0,4}(?:\\\"\\\"\\\"|'''|\\\"|'|`)\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*(?:\\\"\\\"\\\"|'''|\\\"|'|`)#{0,4}|[A-Za-z0-9]{0,3}R\\\"[A-Za-z0-9_]{0,16}\\(\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\)[A-Za-z0-9_]{0,16}\\\"|\\[=*\\[\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*\\]=*\\]|(?:%[qQ]|~[sS])[\\(\\[\\{</!]\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[\\)\\]\\}>/!]|<<<[ \\t]*(?:'[A-Za-z_][A-Za-z0-9_]*'|\\\"?[A-Za-z_][A-Za-z0-9_]*\\\"?)\\r?\\n\\s*[A-Za-z0-9_\\-+/=]*[0-9][A-Za-z0-9_\\-+/=]*\\s*[A-Za-z_][A-Za-z0-9_]*)$"
]

