# Protected-workflow quality gate for `varde scan` (GitLab CI).
#
# PROTECTED WORKFLOW REQUIREMENT: include this job from a protected pipeline
# (for example a compliance pipeline or a protected-branch pipeline execution
# policy). A merge request's own .gitlab-ci.yml can drop the job or add
# `allow_failure: true`, so a gate defined only there is not a gate.
#
# rulesRef is the base ref: rules, thresholds and overrides are read from the
# target branch, so an MR cannot loosen its own gate. An MR that edits them
# gets a blocking `config-changed` diagnostic.
#
# Default severityThreshold is error: cap and floor block, the mean reports.
# For the mean to block too, replace severityThreshold with gateRules.
# Optional: add "changedSince":"origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" to
# limit floor and cap findings to changed files (the mean covers the full scope).
varde-quality-gate:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - varde map build --repo-root .
    - |
      varde scan --json "{\"repoRoot\":\".\",\"severityThreshold\":\"error\",\"rulesRef\":\"origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME\"}" > scan.json || status=$?
      cat scan.json
      if grep -q 'quality-function-cap\|quality-file-floor' scan.json; then
        cat <<'WORDING'
      These findings fail the gate because `quality-function-cap` and `quality-file-floor` are errors by default. To fix: start with the worst functions and files listed above. To turn a rule down on purpose: set `[rules.quality-function-cap] severity = "warning"` and a `reason` in `.varde-code/overrides.toml`. Turning a rule down is a decision that should be recorded: it is reported by CI as a severity downgrade, `varde scan rules list` shows it, and the findings keep appearing on every run.
      WORDING
      fi
      exit "${status:-0}"
