[tool.uv]
required-version = "==0.12.19"

[tool.uv.workspace]
members = ["core", "toz", "code", "learn", "workflow", "dev", "visualize", "design", "app", "runner", "data", "serve"]

[tool.uv.sources]
varde-core = { workspace = true }
varde-code = { workspace = true }
varde-workflow = { workspace = true }
varde-learn = { workspace = true }
varde = { workspace = true }
varde-toz = { workspace = true }
varde-dev = { workspace = true }
varde-visualize = { workspace = true }
varde-design = { workspace = true }
varde-runner = { workspace = true }
varde-data = { workspace = true }
varde-serve = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-timeout>=2.3,<3", "pytest-xdist>=3.6,<4", "ruff", "pyright[nodejs]"]

[tool.pytest.ini_options]
timeout = 300
timeout_method = "thread"
markers = [
    "slow: integration, stress, scale, browser, or full-matrix test",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# Test fixture helper modules are put on sys.path by the test conftests at runtime.
extraPaths = ["code/tests/quality_gate/fixtures", "design/corpus"]
include = [
    "design",
    "visualize",
    "app",
    "toz",
    "learn",
    "code",
    "core",
    "workflow",
    "runner",
    "data",
    "serve",
]
exclude = [
    "**/skills/**",
    "**/node_modules",
    "**/tests/**/fixtures/**",
    # Benchmark harnesses were never type-checked.
    "code/bench",
    "runner/bench",
    # Shipped seeded samples are deliberately mixed-quality data.
    "code/src/varde_code/quality_score/samples/*/**",
    # Packaged and fixture solutions import `solution` as a sibling file.
    "code/src/varde_code/quality_score/baseline_data/**",
    "code/tests/quality_score/baseline_fixture/**",
]
strict = ["core/src/varde_core/io.py", "core/src/varde_core/module.py"]

[tool.ruff]
# Workspace members require Python 3.14+; skill scripts target Python 3.9.
target-version = "py314"
per-file-target-version = { "**/skills/**/*.py" = "py39" }
extend-exclude = [
    # Fixture sources are examples and inputs, not maintained Python modules.
    "**/tests/**/fixtures/**",
    # Golden files capture expected output and should remain byte-for-byte stable.
    "**/tests/**/golden/**",
    "**/tests/**/goldens/**",
    "code/bench/quality-corpus/items/**",
    # Seeded samples and their gaming variants are deliberately mixed-quality data.
    "code/bench/quality-corpus/seeded/**",
    # Shipped seeded samples are deliberately mixed-quality data, one directory per sample.
    "code/src/varde_code/quality_score/samples/*/**",
    "code/bench/quality-corpus/spike/sample/**",
    "code/bench/call-resolution/envs/**",
    "code/bench/call-resolution/data/**",
    "code/bench/quality-corpus/corpus/cache/**",
    # Generated baseline solutions (model output kept as data).
    "code/bench/quality-corpus/baseline/agreed/**",
    "code/src/varde_code/quality_score/baseline_data/**",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "C4", "TC", "C90", "PLR", "RUF100", "RET", "FURB", "PLW", "PERF", "S", "E", "TRY"]
ignore = [
    "PLR2004", # Literal protocol and fixture values keep assertions readable.
    "TC001", # Runtime-evaluated annotations make moving first-party imports unsafe.
    "TC002", # Runtime-evaluated annotations make moving third-party imports unsafe.
    "TC003", # Runtime-evaluated annotations make moving standard-library imports unsafe.
    "TRY003", # Long messages in raised exceptions are CLI-facing errors; a class per message adds indirection without benefit.
    # Deferred to a later per-file pass.
]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions are the test mechanism.
"**/tests/**" = ["S101"]
# Fast-index sources are pinned by a digest guard (code/tests/quality_pass/guards); edits need D28 measurement.
"code/src/varde_code/index/**" = ["RET504", "PERF401"]
"code/src/varde_code/extract/**" = ["FURB171", "PERF401", "PLW0108", "RET504"]
"code/src/varde_code/complexity.py" = ["E501"] # Fast-index source is digest-pinned (edits need D28 measurement); long lines stay unchanged.
"code/src/varde_code/parse.py" = ["E501"] # Fast-index source is digest-pinned (edits need D28 measurement); long lines stay unchanged.
"code/src/varde_code/index/prune.py" = ["TRY300"] # Fast-index source is digest-pinned (edits need D28 measurement); the return stays in the try body.
"code/src/varde_code/index/repo_lock.py" = ["TRY300"] # Fast-index source is digest-pinned (edits need D28 measurement); the return stays in the try body.
# Fast-index sources are digest-pinned (edits need D28 measurement); the SQL fragment is a generated placeholder list, never user input.
"code/src/varde_code/index/persist/edges.py" = ["S608", "E501"]
"code/src/varde_code/index/persist/entities.py" = ["S608", "E501"]
"code/src/varde_code/index/slice.py" = ["S608", "E501"]
# Keep Z timestamp parsing compatible with Python 3.9 and 3.10.
