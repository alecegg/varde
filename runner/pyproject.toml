[project]
name = "varde-runner"
version = "0.1.0"
description = "Agent session runner and dashboard"
requires-python = ">=3.14"
dependencies = [
    "starlette>=0.46,<1",
    "uvicorn>=0.54.0",
    "varde-core",
    "varde-data",
    "varde-workflow",
]

[project.optional-dependencies]
paseo = []

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
]

[project.scripts]
varde-runner = "varde_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/varde_runner"]
artifacts = ["src/varde_runner/web/static/ui/**"]
