name: checks
on: [push, pull_request]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Reference pointers resolve
        run: ./check-refs.sh
      - name: Skill structure and mode manifest
        run: bash tests/consolidated-workflows.sh
      - name: Catalogue documentation
        run: bash tests/catalogue-docs.sh
      - name: Install catalogue
        run: bash tests/install-catalogue.sh
      - name: Frontmatter valid
        run: |
          for d in varde-*/; do
            uv run varde-agent-doc-authoring/scripts/validate-frontmatter.py "$d"
          done
