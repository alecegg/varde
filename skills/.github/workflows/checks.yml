name: checks
on: [push, pull_request]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Shared references in sync
        run: ./sync-shared-refs.sh --check
      - name: No _shared/ pointers in installed files
        run: ./check-refs.sh
      - name: Frontmatter valid
        run: |
          for d in varde-*/; do
            uv run varde-agent-doc-authoring/scripts/validate-frontmatter.py "$d"
          done
