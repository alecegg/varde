<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good page - dashboard system</title>
<style>
:root{--bg:#10141a;--panel:#1a2029;--fg:#e8ecf1;--muted:#a3adb9;--accent:#5cb2ff;--radius:10px;--s1:4px;--s2:8px;--s3:12px;--s4:20px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{padding:var(--s4);display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
h1{grid-column:1/-1;font-size:1.5rem;margin:0}
.tile{background:var(--panel);border-radius:var(--radius);padding:var(--s4)}
.tile p{margin:var(--s2) 0 0;color:var(--muted)}
.value{font-size:2rem;font-weight:600}
button{min-height:44px;padding:var(--s2) var(--s4);border:0;border-radius:var(--radius);background:var(--accent);color:#08121c;font:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){button{transition:opacity 120ms ease-out}button:hover{opacity:.9}}
</style>
</head>
<body>
<main>
<h1>Service health</h1>
<section class="tile"><div class="value">99.95%</div><p>Availability, 30 days</p></section>
<section class="tile"><div class="value">212 ms</div><p>Median latency</p></section>
<section class="tile"><div class="value">3</div><p>Open incidents</p><button type="button">View incidents</button></section>
</main>
</body>
</html>
