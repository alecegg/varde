<!doctype html>
<html lang="en">
<head>
<!-- clean twin: S8 - Real copy that contains near-miss words -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture S8 clean twin</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#595959;--accent:#2457c5;--radius:6px;--s1:4px;--s2:8px;--s3:16px;--s4:24px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:0 auto;padding:var(--s4) var(--s3)}
h1,h2,h3{line-height:1.2}
a{color:var(--accent)}
.btn{display:inline-block;min-height:44px;padding:var(--s2) var(--s3);border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:#fff}
:focus-visible{outline:2px solid #1a4fd6;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Welcome</h1>
<p>Dolores Chen runs the to-do list pilot in Lisbon.</p>
<p>Read the <a href="https://docs.python.org/">Python docs</a>.</p>
</main>
</body>
</html>
