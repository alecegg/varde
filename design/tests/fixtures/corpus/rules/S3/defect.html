<!doctype html>
<html lang="en">
<head>
<!-- planted defect: S3 - Rounded card with a 4px accent left border -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture S3 planted defect</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#595959;--accent:#2457c5;--radius:6px;--s1:4px;--s2:8px;--s3:16px;--s4:24px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:0 auto;padding:var(--s4) var(--s3)}
h1,h2,h3{line-height:1.2}
a{color:var(--accent)}
.btn{display:inline-block;min-height:44px;padding:var(--s2) var(--s3);border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:#fff}
.card{border:1px solid #ddd;border-left:4px solid var(--accent);border-radius:12px;padding:var(--s3)}</style>
</head>
<body>
<main>
<div class="card"><h2>Deploys</h2><p>12 this week.</p></div>
</main>
</body>
</html>
