[project]
name = "varde-serve"
version = "0.1.0"
description = "Long-running local Varde daemon, HTTP API and MCP stdio shim"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "starlette>=0.46,<1",
    "uvicorn>=0.54.0",
    "varde-core",
    "varde-data",
    "varde-learn",
    "varde-workflow",
]

[project.scripts]
varde-serve = "varde_serve.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "varde_serve"
