name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Check tag matches workspace version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' clis/Cargo.toml | head -n 1)"
          if [ "${TAG#v}" != "$version" ]; then
            printf 'Tag %s does not match workspace version %s\n' "$TAG" "$version" >&2
            exit 1
          fi
      - name: Build CLI
        run: cargo build --locked --release --manifest-path clis/Cargo.toml --package varde --bin varde
      - name: Generate third-party notices
        run: python3 clis/code/scripts/gen-third-party-licenses.py
      - name: Package binaries and notices
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package dist
          cp clis/target/release/varde package/
          cp LICENSE clis/code/THIRD-PARTY-LICENSES.md package/
          tar -czf "dist/varde-${TARGET}.tar.gz" -C package .
      - name: Verify release archive contents
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="dist/varde-${TARGET}.tar.gz"
          expected="$(printf '%s\n' LICENSE THIRD-PARTY-LICENSES.md varde | sort)"
          actual="$(tar -tzf "$archive" | sed -e '/^\.\/$/d' -e 's#^\./##' | sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'Unexpected contents in %s\nExpected:\n%s\nActual:\n%s\n' "$archive" "$expected" "$actual" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name 'varde-*.tar.gz' | wc -l)" -eq 3
          sha256sum varde-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/varde-*.tar.gz dist/SHA256SUMS --clobber
